[workspace]
resolver = "3"
members = ["app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# target/ の肥大を抑える。自前のクレートは行番号だけを残し、依存クレートの
# デバッグ情報は作らない。スタックトレースの行番号は残るが、デバッガで変数の
# 中身は見られない。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
