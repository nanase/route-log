[workspace]
resolver = "3"
members = [
    "crates/routelog-access",
    "crates/routelog-core",
    "crates/routelog-geo",
    "crates/routelog-overview",
    "crates/routelog-video",
    "app/src-tauri",
    "worker",
]
# Worker は wasm 向けなので、ふだんの cargo test や clippy の対象から外す。
default-members = [
    "crates/routelog-access",
    "crates/routelog-core",
    "crates/routelog-geo",
    "crates/routelog-overview",
    "crates/routelog-video",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
routelog-access = { path = "crates/routelog-access" }
routelog-core = { path = "crates/routelog-core" }
routelog-geo = { path = "crates/routelog-geo" }
routelog-overview = { path = "crates/routelog-overview" }
routelog-video = { path = "crates/routelog-video" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# target/ の肥大を抑える。自前のクレートは行番号だけを残し、依存クレートの
# デバッグ情報は作らない。スタックトレースの行番号は残るが、デバッガで変数の
# 中身は見られない。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# 抽出は点ごとに索引を引くので、最適化なしでは索引を作るだけで秒単位かかる。
[profile.dev.package.rstar]
opt-level = 3

[profile.dev.package.routelog-geo]
opt-level = 2

# 概略図の動画は、4K の絵を何百枚も描く。最適化なしでは 1 枚に秒単位かかる。
[profile.dev.package.routelog-overview]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

# Worker は大きさに上限があるので、小ささを優先する。strip は付けない。付けると
# wasm-bindgen が要る情報まで消え、Worker のビルドが「externref table required」で止まる。
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
