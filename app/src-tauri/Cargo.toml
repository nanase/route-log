[package]
name = "routelog"
version.workspace = true
edition.workspace = true
description = "走行経路と時刻を記録し、ドラレコ動画の字幕のタイミングを出す"

[lib]
name = "routelog_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
routelog-core.workspace = true
routelog-video.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
